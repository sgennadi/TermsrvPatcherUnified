name: Collect optional DLL diagnostic observations (UNVERIFIED)

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termsrv-diagnostic-observations
  cancel-in-progress: false

jobs:
  collect:
    # GitHub issues can be opened by anyone. This workflow treats the event
    # body strictly as untrusted user-supplied text, never an approved patch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'opened')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Validate event parser on synthetic approved and hostile inputs
        run: python3 scripts/record_diagnostic_observation.py --self-test
      - name: Aggregate typed, opt-in, UNVERIFIED DLL evidence
        if: github.event_name == 'issues'
        env:
          GH_EVENT: ${{ github.event_path }}
        run: python3 scripts/record_diagnostic_observation.py "$GH_EVENT" data/diagnostic-observations.csv
      - name: Save sanitized observations only, never active patterns
        if: github.event_name == 'issues'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/diagnostic-observations.csv; then
            echo "No valid opt-in Windows/DLL observation was found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/diagnostic-observations.csv
          git commit -m "chore: record unverified DLL diagnostic observation"
          git push origin HEAD:main
