name: Signing configuration readiness (no key access)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-signing-configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Check public SPKI pin format only
        shell: bash
        env:
          TPU_SIGNER_SPKI_SHA256: ${{ vars.TPU_SIGNER_SPKI_SHA256 }}
        run: |
          if [[ ! "$TPU_SIGNER_SPKI_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Set repository variable TPU_SIGNER_SPKI_SHA256 to the signing key's 64-character SPKI SHA-256."
            exit 1
          fi
          echo "Public signing key pin is configured (format only)."
          echo "No signing secret is accessed by this workflow."
