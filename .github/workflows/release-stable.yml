name: Publish Stable Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-stable-main
  cancel-in-progress: false

jobs:
  publish-stable:
    if: github.repository == 'sgennadi/TermsrvPatcherUnified' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate explicit stable tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^1\.[0-9]+\.[0-9]+$') {
            Write-Host 'Not a Stable 1.x version; Stable publisher safely skipped.'
            "PUBLISH_STABLE=false" >> $env:GITHUB_ENV
            exit 0
          }
          "PUBLISH_STABLE=true" >> $env:GITHUB_ENV
          $project = [xml](Get-Content TermsrvPatcher.Unified.csproj -Raw)
          if ($project.Project.PropertyGroup.Version -ne $version) { throw 'The project version does not match VERSION.' }
          if (-not (Get-Content Core/UpdateIntegration.cs -Raw).Contains('Version = "' + $version + '"')) { throw 'The updater version does not match VERSION.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
      - name: Embed preconfigured public diagnostics provider IDs (no per-user setup)
        if: env.PUBLISH_STABLE == 'true'
        shell: pwsh
        env:
          TPU_GOOGLE_APPS_SCRIPT_URL: ${{ vars.TPU_GOOGLE_APPS_SCRIPT_URL }}
          TPU_GITHUB_OAUTH_CLIENT_ID: ${{ vars.TPU_GITHUB_OAUTH_CLIENT_ID }}
        run: |
          ./scripts/Configure-Reporting.ps1 -FromEnvironment
      - name: Stage pinned official NSudo 8.2 x64
        if: env.PUBLISH_STABLE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-nsudo.ps1
      - name: Check source and updater ZIP validator
        if: env.PUBLISH_STABLE == 'true'
        shell: pwsh
        run: |
          python scripts/verify_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_update_package.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/record_successful_fix.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/record_offline_fix.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and execute synthetic tests
        if: env.PUBLISH_STABLE == 'true'
        shell: pwsh
        run: |
          dotnet restore TermsrvPatcher.Unified.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore Tests/TermsrvPatcher.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --ui-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --rdp-health-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --rdp-policy-history-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --rdp-transaction-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --pattern-inspection-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --direct-report-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --dll-compatibility-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --offline-dll-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --dll-backup-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --operation-lock-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/record_diagnostic_observation.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v5
        if: env.PUBLISH_STABLE == 'true'
        with:
          node-version: '24'
      - name: Validate Google Apps Script gateway schemas and deduplication (offline)
        if: env.PUBLISH_STABLE == 'true'
        shell: pwsh
        run: node scripts/test_google_gateway.cjs
      - name: Publish self-contained x64 EXE
        if: env.PUBLISH_STABLE == 'true'
        shell: pwsh
        run: |
          dotnet publish TermsrvPatcher.Unified.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:RequireNSudo=true -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read-only EXE and offline update probe smoke tests
        if: env.PUBLISH_STABLE == 'true'
        shell: pwsh
        run: |
          $sample = Join-Path $PWD 'sample.dll'
          $report = Join-Path $PWD 'report.txt'
          [System.IO.File]::WriteAllBytes($sample, [byte[]](0x39,0x81,0x3C,0x06,0,0,0x0F,0x84,0x6F,0x66,0x01,0))
          $exe = Join-Path $PWD 'publish/TermsrvPatcherUnified.exe'
          $inspect = Start-Process -FilePath $exe -ArgumentList ('--inspect-file "{0}" --report "{1}"' -f $sample,$report) -Wait -PassThru
          if ($inspect.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Read-only inspection failed.' }
          $product = (Get-Item $exe).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($product)) { throw 'Published EXE ProductVersion is missing.' }
          $sourceVersion = ($product -split '\+')[0]
          if ($sourceVersion -ne $env:RELEASE_VERSION) {
            throw "EXE ProductVersion mismatch: $sourceVersion (expected $env:RELEASE_VERSION)."
          }
          $probe = Start-Process -FilePath $exe -ArgumentList '--update-probe', $env:RELEASE_VERSION -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw "Update health probe failed: $($probe.ExitCode)" }
          $bad = Start-Process -FilePath $exe -ArgumentList '--update-probe', '0.0.0' -Wait -PassThru
          if ($bad.ExitCode -eq 0) { throw 'The health probe accepted a wrong version.' }
      - name: Non-destructive SYSTEM worker final Stable gate
        if: env.PUBLISH_STABLE == 'true'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/TermsrvPatcherUnified.exe'
          foreach ($round in 1..2) {
            $probe = Start-Process -FilePath $exe -ArgumentList '--isolated-executor-qa' -Wait -PassThru
            if ($probe.ExitCode -ne 0) { throw "Protected SYSTEM worker probe $round failed with code $($probe.ExitCode). No system DLL was modified." }
            Write-Host "PASS: non-destructive SYSTEM/Session 0 worker round $round; no real DLL writes."
          }
      - name: Package exact two-file portable ZIP and one-EXE updater ZIP
        if: env.PUBLISH_STABLE == 'true'
        shell: pwsh
        run: ./scripts/package_preview.ps1
      - name: Publish Stable release only after all gates
        if: env.PUBLISH_STABLE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $exists = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Existing $tag release retained unchanged."; exit 0 }
          $notes = @(
            '1. Show current DLL STATUS: PATCHED, NOT PATCHED or UNKNOWN in Simple and Advanced.'
            '2. Show Revert readiness separately, with SHA-256 and version-bound recovery evidence.'
            '3. Fail closed on contradictory, stale or changing DLL and recovery evidence.'
            '4. Require a fresh status check after Apply/Revert, including SYSTEM scheduled jobs.'
            '5. Keep the Firewall/RDP Doctor improvements, approved updates and rollback.'
            ''
            'TermsrvPatcherUnified 1.0.7 Stable - unsigned Windows x64.'
            'Installation and protected operations require administrator approval.'
            'Matching DLL bytes do not prove successful remote sign-in or Microsoft licensing.'
            'Synthetic Windows CI and harmless SYSTEM/Session 0 tests do not replace real RDP testing.'
            'Portable ZIP: TermsrvPatcherUnified.exe and Example.txt. Updater ZIP: one EXE. SHA256SUMS.txt supplies checksums.'
          )
          Set-Content release-notes.txt -Value $notes -Encoding utf8
          gh release create $tag TermsrvPatcherUnified-win-x64.zip TermsrvPatcherUnified-update-win-x64.zip SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "TermsrvPatcherUnified $env:RELEASE_VERSION (Stable)" --notes-file release-notes.txt --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify published updater release assets
        if: env.PUBLISH_STABLE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read back the published GitHub release.' }
          $expected = @('TermsrvPatcherUnified-win-x64.zip', 'TermsrvPatcherUnified-update-win-x64.zip', 'SHA256SUMS.txt')
          $unexpected = @(Compare-Object -ReferenceObject $expected -DifferenceObject $assets)
          if ($unexpected.Count -ne 0) {
            throw ('Published release asset set does not match exactly the three required files: ' + ($unexpected | Out-String))
          }
          Write-Host ('PASS: exactly three release assets verified for ' + $env:RELEASE_TAG)
