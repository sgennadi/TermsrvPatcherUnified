            throw 'Release executable has no valid Authenticode signature.'
          }
          $cert = $signature.SignerCertificate
          $rsa = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($cert)
          if ($null -eq $rsa) { throw 'Release signer is not an RSA key.' }
          try {
            $actual = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($rsa.ExportSubjectPublicKeyInfo()))
          } finally { $rsa.Dispose() }
          if ($actual -ne $env:TPU_PIN) { throw 'Release signer does not match pinned SPKI.' }
          Write-Host 'PASS: signed release executable matches configured signer pin.'
