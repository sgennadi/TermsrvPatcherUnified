name: Windows build and safety tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Stage and verify official NSudo 8.2 x64
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-nsudo.ps1
      - name: Validate catalogs, XAML handlers and repository source
        shell: pwsh
        run: |
          python scripts/verify_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_update_package.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/record_successful_fix.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/record_offline_fix.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore source and tests
        run: |
          dotnet restore TermsrvPatcher.Unified.csproj
          dotnet restore Tests/TermsrvPatcher.Tests.csproj
      - name: Run synthetic pattern, similarity and PE safety tests
        run: dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore
      - name: Offline x86 and x64 DLL patch-copy, CRC32/SHA-256, and report safety
        shell: pwsh
        run: |
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --offline-dll-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Protected cross-thread OperationLock regression
        shell: pwsh
        run: |
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --operation-lock-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Local DLL drift and native WTS session inventory safety tests
        shell: pwsh
        run: |
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --rdp-health-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: RDP policy registry and privacy-safe history regression (read-only)
        shell: pwsh
        run: |
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --rdp-policy-history-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real DLL copy backup, Restore, tamper and no-backup integrity tests
        shell: pwsh
        run: |
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --dll-backup-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: WPF window creation and synthetic 100%-200% layouts (offscreen)
        shell: pwsh
        run: |
          dotnet run --project Tests/TermsrvPatcher.Tests.csproj -c Release --no-restore -- --ui-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained x64 preview
        run: dotnet publish TermsrvPatcher.Unified.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:RequireNSudo=true -o publish
      - name: Test the published EXE in read-only inspection mode
        shell: pwsh
        run: |
          $inputFile = Join-Path $PWD 'scan-sample.dll'
          $reportFile = Join-Path $PWD 'scan-smoke.txt'
          [System.IO.File]::WriteAllBytes($inputFile, [byte[]](0x39,0x81,0x3C,0x06,0x00,0x00,0x0F,0x84,0x6F,0x66,0x01,0x00))
          $exe = Join-Path $PWD 'publish/TermsrvPatcherUnified.exe'
          $arguments = '--inspect-file "{0}" --report "{1}"' -f $inputFile, $reportFile
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Read-only EXE smoke test failed: $($process.ExitCode)" }
          if (-not (Test-Path $reportFile)) { throw 'No inspection report was created.' }
          if (-not ((Get-Content $reportFile -Raw) -match 'read-only DLL inspection')) { throw 'Unexpected inspection report.' }
          $healthy = Start-Process -FilePath $exe -ArgumentList '--update-probe', '0.1.0-preview.12' -Wait -PassThru
          if ($healthy.ExitCode -ne 0) { throw "Updater health probe failed: $($healthy.ExitCode)" }
          $wrong = Start-Process -FilePath $exe -ArgumentList '--update-probe', '0.0.0' -Wait -PassThru
          if ($wrong.ExitCode -eq 0) { throw 'Updater accepted an incorrect version.' }
      - name: Include license and third-party notices
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'LICENSE' -Destination 'publish/LICENSE' -Force
          Copy-Item -LiteralPath 'NOTICE.md' -Destination 'publish/NOTICE.md' -Force
          Copy-Item -LiteralPath 'CHANGELOG.md' -Destination 'publish/CHANGELOG.md' -Force
          New-Item -ItemType Directory -Force -Path 'publish/licenses' | Out-Null
          Copy-Item -LiteralPath 'licenses/NSudo-MIT.txt' -Destination 'publish/licenses/NSudo-MIT.txt' -Force
          Copy-Item -LiteralPath 'licenses/fabianosrc-MIT.txt' -Destination 'publish/licenses/fabianosrc-MIT.txt' -Force
      - name: Package preview
        shell: pwsh
        run: |
          Compress-Archive -Path 'publish/*' -DestinationPath 'TermsrvPatcherUnified-win-x64.zip' -Force
          Compress-Archive -Path 'publish/TermsrvPatcherUnified.exe' -DestinationPath 'TermsrvPatcherUnified-update-win-x64.zip' -Force
          python scripts/verify_update_package.py TermsrvPatcherUnified-update-win-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checksums = foreach ($name in @('TermsrvPatcherUnified-win-x64.zip', 'TermsrvPatcherUnified-update-win-x64.zip')) {
            '{0}  {1}' -f (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant(), $name
          }
          Set-Content SHA256SUMS.txt -Value $checksums -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: TermsrvPatcherUnified-preview-win-x64
          path: |
            TermsrvPatcherUnified-win-x64.zip
            TermsrvPatcherUnified-update-win-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
